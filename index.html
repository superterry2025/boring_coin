<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Boring Coin &#183; &#32763;&#30828;&#24065;</title>
  <style>
    :root{--bg:#080a10;--panel:#111722;--line:#ffffff18;--ink:#f4f6fb;--muted:#8993a8;--cyan:#67e8f9;--gold:#f7c948;--gold2:#d97706;--edge:#b45309}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#243049 0,transparent 45%),var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    main{width:min(1160px,calc(100% - 32px));margin:auto;padding:34px 0 60px}.topbar{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:20px}.eyebrow{color:var(--cyan);font-size:11px;font-weight:900;letter-spacing:.2em}.title{margin:8px 0 0;font-size:clamp(30px,5vw,54px);letter-spacing:-.06em;line-height:1}.title span{color:var(--cyan)}.tag{padding:9px 13px;border:1px solid var(--line);border-radius:99px;color:var(--muted);font-size:12px;white-space:nowrap}
    .settings{padding:22px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(140deg,#121a28ee,#0c111add);box-shadow:0 20px 70px #0005}.settings-grid{display:grid;grid-template-columns:1.05fr 1fr 1.15fr;gap:22px}.group{min-width:0}.group+.group{border-left:1px solid var(--line);padding-left:22px}.label{display:block;color:#c8d0e1;font-size:12px;font-weight:800;margin-bottom:10px}.range-row{display:flex;justify-content:space-between;align-items:center}.percent{font-size:18px;color:var(--cyan);font-weight:900}input[type=range]{width:100%;accent-color:var(--cyan)}.inputs{display:grid;grid-template-columns:1fr 1fr;gap:9px}input[type=text]{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px 12px;background:#05070b;color:var(--ink);outline:0}.styles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.style{border:1px solid var(--line);border-radius:11px;background:#ffffff08;color:#dce5f4;padding:8px 3px;font-size:11px;cursor:pointer}.style i{display:block;width:24px;height:24px;border-radius:50%;margin:0 auto 6px;background:var(--swatch);box-shadow:inset -5px -5px 8px #0005}.style.active{border-color:var(--cyan);box-shadow:0 0 0 2px #67e8f926}
    .bridge{height:116px;margin:20px 0;position:relative;overflow:hidden;border:1px solid #ffffff14;border-radius:24px;background:#020307 url("assets/loading-bear.png") center 44%/cover no-repeat;box-shadow:inset 0 0 80px #000,0 15px 45px #0005}.bridge:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#020307 0%,#02030718 35%,#02030718 65%,#020307 100%)}.bridge-copy{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:14px;z-index:1;text-transform:uppercase;letter-spacing:.18em;font-size:11px;font-weight:900;color:#e7edf8}.pulse{width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 18px var(--cyan);animation:pulse 1.3s infinite}@keyframes pulse{50%{opacity:.2;transform:scale(.7)}}
    .coin-zone{min-height:610px;position:relative;display:grid;place-items:center;overflow:hidden;border:1px solid var(--line);border-radius:30px;background:radial-gradient(circle at 50% 40%,#263044 0,transparent 45%),linear-gradient(150deg,#111927,#080b11 70%);box-shadow:0 30px 100px #0008}.zone-caption{position:absolute;top:24px;left:28px;color:var(--muted);font-size:12px}.zone-caption strong{display:block;color:var(--ink);font-size:16px;margin-top:4px}.coin-shadow{position:absolute;width:290px;height:38px;border-radius:50%;background:#000;filter:blur(20px);bottom:116px;opacity:.7}.coin-wrap{width:310px;height:310px;perspective:1200px;position:relative;z-index:2}.coin{width:100%;height:100%;position:relative;transform-style:preserve-3d;cursor:pointer;transition:transform 1.1s cubic-bezier(.2,.85,.2,1)}.coin:focus-visible{outline:4px solid var(--cyan);outline-offset:12px;border-radius:50%}.coin.flipping{animation:flip 1.15s cubic-bezier(.25,.65,.25,1)}@keyframes flip{to{transform:rotateY(1800deg) rotateZ(6deg)}}.face{position:absolute;inset:0;border-radius:50%;backface-visibility:hidden;display:grid;place-items:center;overflow:hidden;border:11px solid var(--edge);background:radial-gradient(circle at 30% 25%,#fff4a3,#facc15 24%,var(--gold) 55%,var(--gold2));box-shadow:inset 0 0 0 2px #fff9,inset -24px -24px 40px #78350f55,0 30px 38px #0008}.face:after{content:"";position:absolute;inset:22px;border:2px dashed #78350f66;border-radius:50%}.back{transform:rotateY(180deg)}.face-content{position:relative;z-index:1;text-align:center;color:#713f12;text-shadow:0 1px #fff7}.face-icon{font-size:72px;line-height:1}.face-label{font-size:30px;font-weight:950;margin-top:13px;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.coin-hint{position:absolute;bottom:31px;color:var(--muted);font-size:13px}.result{position:absolute;right:28px;bottom:27px;text-align:right}.result small{display:block;color:var(--muted);font-size:11px}.result strong{font-size:22px}.loading{position:absolute;inset:0;z-index:5;display:grid;place-items:center;background:#020307e8 url("assets/loading-bear.png") center/cover;opacity:0;pointer-events:none;transition:opacity .25s}.loading.show{opacity:1}.loading:after{content:"";position:absolute;inset:0;background:#0009}.loading span{position:relative;z-index:1;color:#fff;letter-spacing:.24em;font-size:12px;font-weight:900;animation:blink 1s infinite}@keyframes blink{50%{opacity:.28}}
    @media(max-width:800px){.topbar{display:block}.tag{display:inline-block;margin-top:15px}.settings-grid{grid-template-columns:1fr}.group+.group{border-left:0;border-top:1px solid var(--line);padding:18px 0 0}.coin-zone{min-height:520px}.coin-wrap{width:245px;height:245px}.face-label{font-size:24px}.face-icon{font-size:58px}.coin-shadow{width:230px;bottom:100px}.result{right:20px;bottom:20px}}
  </style>
</head>
<body>
  <main>
    <header class="topbar"><div><div class="eyebrow">BORING COIN / FLIP LAB</div><h1>&#20808;&#35774;&#32622;&#65292;<span>&#20877;&#32763;&#36716;&#12290;</span></h1></div><div class="tag">&#28857;&#20987;&#19979;&#26041;&#22823;&#30828;&#24065;&#24320;&#22987;</div></header>
    <section class="settings" aria-label="&#30828;&#24065;&#35774;&#32622;"><div class="settings-grid"><div class="group"><span class="label">&#27491;&#38754;&#27010;&#29575; <b class="percent" id="percent">50%</b></span><input id="probability" type="range" min="0" max="100" value="50"><small style="color:var(--muted)">&#21453;&#38754;&#27010;&#29575;&#65306;<span id="otherPercent">50%</span></small></div><div class="group"><span class="label">&#20004;&#38754;&#25991;&#23383;</span><div class="inputs"><input id="frontText" type="text" value="&#27491;&#38754;" maxlength="10"><input id="backText" type="text" value="&#21453;&#38754;" maxlength="10"></div></div><div class="group"><span class="label">&#30828;&#24065;&#26679;&#24335;</span><div class="styles"><button class="style active" data-style="gold"><i style="--swatch:linear-gradient(135deg,#fff4a3,#eab308 55%,#92400e)"></i>&#40644;&#37329;</button><button class="style" data-style="rose"><i style="--swatch:linear-gradient(135deg,#ffe4e6,#fb7185 55%,#9f1239)"></i>&#29611;&#29808;</button><button class="style" data-style="ice"><i style="--swatch:linear-gradient(135deg,#cffafe,#22d3ee 55%,#155e75)"></i>&#20912;&#34013;</button><button class="style" data-style="violet"><i style="--swatch:linear-gradient(135deg,#ede9fe,#a78bfa 55%,#5b21b6)"></i>&#26143;&#32043;</button></div></div></div></section>
    <div class="bridge"><div class="bridge-copy"><i class="pulse"></i> preparing your flip</div></div>
    <section class="coin-zone"><div class="zone-caption">THE BIG COIN<strong>&#28857;&#20987;&#30828;&#24065;&#32763;&#36716;</strong></div><div class="coin-shadow"></div><div class="coin-wrap"><div class="coin" id="coin" tabindex="0" role="button" aria-label="&#28857;&#20987;&#32763;&#36716;&#30828;&#24065;"><div class="face front"><div class="face-content"><div class="face-icon">&#9728;</div><div class="face-label" id="frontLabel">&#27491;&#38754;</div></div></div><div class="face back"><div class="face-content"><div class="face-icon">&#9790;</div><div class="face-label" id="backLabel">&#21453;&#38754;</div></div></div></div></div><div class="coin-hint">CLICK / SPACE</div><div class="result"><small>&#26412;&#27425;&#32467;&#26524;</small><strong id="result">&#20934;&#22791;&#22909;&#20102;&#21527;&#65311;</strong></div><div class="loading" id="loading"><span>LOADING THE NEXT SIDE</span></div></section>
  </main>
  <script>
    const $=s=>document.querySelector(s),coin=$("#coin"),prob=$("#probability"),loading=$("#loading");
    function sync(){$("#percent").textContent=prob.value+"%";$("#otherPercent").textContent=100-prob.value+"%";$("#frontLabel").textContent=$("#frontText").value||"&#27491;&#38754;";$("#backLabel").textContent=$("#backText").value||"&#21453;&#38754;"}
    function flip(){if(coin.classList.contains("flipping"))return;const front=Math.random()*100<+prob.value;loading.classList.add("show");$("#result").textContent="&#32763;&#36716;&#20013;&#8230;";setTimeout(()=>{loading.classList.remove("show");coin.classList.add("flipping");setTimeout(()=>{coin.classList.remove("flipping");$("#result").textContent=front?$("#frontText").value||"&#27491;&#38754;":$("#backText").value||"&#21453;&#38754;"},1150)},500)}
    prob.oninput=sync;["frontText","backText"].forEach(id=>$("#"+id).oninput=sync);coin.onclick=flip;coin.onkeydown=e=>{if(e.code==="Enter"||e.code==="Space"){e.preventDefault();flip()}};
    const themes={gold:["#f7c948","#d97706","#b45309"],rose:["#fb7185","#be123c","#9f1239"],ice:["#67e8f9","#0891b2","#155e75"],violet:["#c4b5fd","#7c3aed","#5b21b6"]};document.querySelectorAll(".style").forEach(b=>b.onclick=()=>{document.querySelectorAll(".style").forEach(x=>x.classList.remove("active"));b.classList.add("active");const t=themes[b.dataset.style];document.documentElement.style.setProperty("--gold",t[0]);document.documentElement.style.setProperty("--gold2",t[1]);document.documentElement.style.setProperty("--edge",t[2])});sync();
  </script>
</body>
</html>
