<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Boring Coin &#183; &#32763;&#30828;&#24065;</title>
<style>
:root{--bg:#0b1020;--panel:rgba(18,25,48,.82);--ink:#edf2ff;--muted:#98a4c7;--a:#22d3ee;--coin:#f7c948;--coin2:#d97706;--edge:#b45309}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 15% 15%,#24305d,transparent 35%),radial-gradient(circle at 85% 85%,#193f50,transparent 32%),var(--bg)}
main{width:min(1120px,calc(100% - 32px));margin:auto;padding:48px 0}.eyebrow{color:var(--a);font-size:12px;letter-spacing:.18em;font-weight:800}h1{font-size:clamp(40px,7vw,78px);line-height:.95;margin:10px 0 12px;letter-spacing:-.06em}h1 span{color:var(--a)}.sub{color:var(--muted);max-width:600px;line-height:1.6}.layout{display:grid;grid-template-columns:1.08fr .92fr;gap:20px}.card{border:1px solid #ffffff1f;background:var(--panel);backdrop-filter:blur(18px);border-radius:28px;box-shadow:0 25px 90px #0004}.stage{min-height:570px;display:grid;place-items:center;position:relative;overflow:hidden}.coin-wrap{perspective:1000px;width:240px;height:240px;position:relative;z-index:1}.coin{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.2,.85,.2,1);cursor:pointer}.coin.flipping{animation:flip 1.1s cubic-bezier(.25,.65,.25,1)}@keyframes flip{to{transform:rotateY(1800deg) rotateZ(8deg)}}.face{position:absolute;inset:0;border-radius:50%;backface-visibility:hidden;display:grid;place-items:center;overflow:hidden;border:9px solid var(--edge);background:radial-gradient(circle at 30% 25%,#fff4a3,#facc15 24%,var(--coin) 55%,var(--coin2));box-shadow:inset 0 0 0 2px #fff8,inset -18px -18px 30px #78350f4d,0 22px 26px #0006}.face:after{content:"";position:absolute;inset:18px;border-radius:50%;border:2px dashed #78350f73}.back{transform:rotateY(180deg)}.face-content{position:relative;z-index:1;text-align:center;color:#713f12}.face-icon{font-size:56px}.face-label{font-size:25px;font-weight:900;margin-top:12px;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.shadow{position:absolute;bottom:90px;width:220px;height:28px;border-radius:50%;background:#000;filter:blur(17px);opacity:.48}.result{position:absolute;bottom:30px;text-align:center}.result small{color:var(--muted);display:block;margin-bottom:6px}.result strong{font-size:26px}.controls{padding:28px}.section+.section{border-top:1px solid #ffffff1a;margin-top:25px;padding-top:25px}label,.label{display:block;font-size:13px;color:#bcc7e7;font-weight:700;margin-bottom:10px}.range-row{display:flex;justify-content:space-between}.percent{color:var(--a);font-weight:900;font-size:20px}input[type=range]{width:100%;accent-color:var(--a)}.inputs{display:grid;grid-template-columns:1fr 1fr;gap:10px}input[type=text]{width:100%;border:1px solid #ffffff24;border-radius:13px;padding:13px 14px;background:#0003;color:var(--ink);outline:0}.styles{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.style{border:1px solid #ffffff24;border-radius:14px;background:#ffffff0d;padding:10px 5px;color:#dfe6ff;cursor:pointer;font-size:12px}.style i{display:block;width:30px;height:30px;border-radius:50%;margin:0 auto 7px;background:var(--swatch)}.active{border-color:var(--a);box-shadow:0 0 0 2px #22d3ee26}.action{width:100%;border:0;border-radius:15px;padding:16px;font-size:17px;font-weight:900;color:#07111d;background:linear-gradient(100deg,var(--a),#a7f3d0);cursor:pointer}.hint{font-size:12px;color:var(--muted);line-height:1.55;margin-top:14px}@media(max-width:780px){.layout{grid-template-columns:1fr}.stage{min-height:500px}}
</style>
</head>
<body>
<main>
<div class="eyebrow">BORING COIN / 3D FLIP LAB</div>
<h1>&#32763;&#20010;&#30828;&#24065;&#65292;<br><span>&#35753;&#27010;&#29575;&#35828;&#35805;&#12290;</span></h1>
<p class="sub">&#33258;&#23450;&#20041;&#20004;&#38754;&#30340;&#27010;&#29575;&#12289;&#25991;&#23383;&#21644;&#22806;&#35266;&#12290;&#28857;&#20987;&#30828;&#24065;&#25110;&#25353;&#31354;&#26684;&#38190;&#65292;&#30475;&#30475;&#36825;&#27425;&#32467;&#26524;&#12290;</p>
<section class="layout">
<div class="card stage"><div class="shadow"></div><div class="coin-wrap"><div class="coin" id="coin" tabindex="0"><div class="face"><div class="face-content"><div class="face-icon">&#9728;</div><div class="face-label" id="frontLabel">&#27491;&#38754;</div></div></div><div class="face back"><div class="face-content"><div class="face-icon">&#9790;</div><div class="face-label" id="backLabel">&#21453;&#38754;</div></div></div></div></div><div class="result"><small>&#26412;&#27425;&#32467;&#26524;</small><strong id="result">&#20934;&#22791;&#22909;&#20102;&#21527;&#65311;</strong></div></div>
<aside class="card controls">
<div class="section"><div class="range-row"><label>&#27491;&#38754;&#27010;&#29575;</label><span class="percent" id="percent">50%</span></div><input id="prob" type="range" min="0" max="100" value="50"><div class="hint">&#21453;&#38754;&#27010;&#29575;&#65306;<span id="other">50%</span></div></div>
<div class="section"><span class="label">&#20004;&#38754;&#25991;&#23383;</span><div class="inputs"><input id="frontText" value="&#27491;&#38754;" maxlength="10"><input id="backText" value="&#21453;&#38754;" maxlength="10"></div></div>
<div class="section"><span class="label">&#30828;&#24065;&#26679;&#24335;</span><div class="styles"><button class="style active" data-c="gold"><i style="--swatch:linear-gradient(135deg,#fff4a3,#eab308 55%,#92400e)"></i>&#40644;&#37329;</button><button class="style" data-c="rose"><i style="--swatch:linear-gradient(135deg,#ffe4e6,#fb7185 55%,#9f1239)"></i>&#29611;&#29790;</button><button class="style" data-c="ice"><i style="--swatch:linear-gradient(135deg,#cffafe,#22d3ee 55%,#155e75)"></i>&#20912;&#34013;</button><button class="style" data-c="violet"><i style="--swatch:linear-gradient(135deg,#ede9fe,#a78bfa 55%,#5b21b6)"></i>&#26143;&#32043;</button></div></div>
<div class="section"><button class="action" id="flip">&#32763;&#36716;&#30828;&#24065;</button><div class="hint">&#24555;&#25463;&#38190;&#65306;&#31354;&#26684;&#38190;</div></div>
</aside></section></main>
<script>
const q=s=>document.querySelector(s),coin=q("#coin"),prob=q("#prob");function sync(){q("#percent").textContent=prob.value+"%";q("#other").textContent=100-prob.value+"%";q("#frontLabel").textContent=q("#frontText").value||"&#27491;&#38754;";q("#backLabel").textContent=q("#backText").value||"&#21453;&#38754;"}function flip(){if(coin.classList.contains("flipping"))return;let front=Math.random()*100<+prob.value;coin.classList.add("flipping");q("#result").textContent="&#26059;&#36716;&#20013;&#8230;";setTimeout(()=>{coin.classList.remove("flipping");q("#result").textContent=front?q("#frontText").value||"&#27491;&#38754;":q("#backText").value||"&#21453;&#38754;"},1100)}prob.oninput=sync;q("#frontText").oninput=sync;q("#backText").oninput=sync;q("#flip").onclick=flip;coin.onclick=flip;document.onkeydown=e=>{if(e.code==="Space"){e.preventDefault();flip()}};document.querySelectorAll(".style").forEach(b=>b.onclick=()=>{document.querySelectorAll(".style").forEach(x=>x.classList.remove("active"));b.classList.add("active");let t={gold:["#f7c948","#d97706","#b45309"],rose:["#fb7185","#be123c","#9f1239"],ice:["#67e8f9","#0891b2","#155e75"],violet:["#c4b5fd","#7c3aed","#5b21b6"]}[b.dataset.c];document.documentElement.style.setProperty("--coin",t[0]);document.documentElement.style.setProperty("--coin2",t[1]);document.documentElement.style.setProperty("--edge",t[2])});sync();
</script>
</body></html>
