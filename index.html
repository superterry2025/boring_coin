<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boring Coin 路 缈荤‖甯?/title>
  <style>
    :root { --bg:#0b1020; --panel:rgba(18,25,48,.78); --ink:#edf2ff; --muted:#98a4c7; --accent:#8b5cf6; --accent2:#22d3ee; --coin:#f7c948; --coin2:#d97706; --edge:#b45309; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:var(--ink); font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; background:radial-gradient(circle at 15% 15%,#24305d 0,transparent 35%),radial-gradient(circle at 85% 85%,#193f50 0,transparent 32%),var(--bg); overflow-x:hidden; }
    .orb { position:fixed; width:28rem; height:28rem; border-radius:50%; filter:blur(70px); opacity:.18; pointer-events:none; background:var(--accent); top:-12rem; right:-8rem; }
    main { width:min(1120px,calc(100% - 32px)); margin:auto; padding:48px 0 56px; }
    header { display:flex; align-items:flex-end; justify-content:space-between; gap:24px; margin-bottom:28px; }
    .eyebrow { color:var(--accent2); font-size:12px; letter-spacing:.18em; text-transform:uppercase; font-weight:800; }
    h1 { font-size:clamp(38px,7vw,78px); line-height:.95; margin:10px 0 12px; letter-spacing:-.065em; }
    .sub { color:var(--muted); max-width:570px; line-height:1.6; margin:0; }
    .badge { border:1px solid rgba(255,255,255,.15); background:rgba(255,255,255,.06); border-radius:999px; padding:10px 14px; color:#cdd6f8; font-size:13px; white-space:nowrap; }
    .layout { display:grid; grid-template-columns:1.08fr .92fr; gap:20px; }
    .card { border:1px solid rgba(255,255,255,.12); background:var(--panel); backdrop-filter:blur(18px); border-radius:28px; box-shadow:0 25px 90px rgba(0,0,0,.26); }
    .stage { min-height:570px; display:grid; place-items:center; position:relative; overflow:hidden; }
    .stage:before { content:""; position:absolute; inset:18%; border-radius:50%; background:radial-gradient(circle,rgba(255,255,255,.12),transparent 68%); }
    .coin-wrap { perspective:1000px; width:240px; height:240px; position:relative; z-index:1; }
    .coin { width:100%; height:100%; position:relative; transform-style:preserve-3d; transition:transform 1s cubic-bezier(.2,.85,.2,1); cursor:pointer; }
    .coin.flipping { animation:flip 1.1s cubic-bezier(.25,.65,.25,1); }
    @keyframes flip { 0%{transform:rotateY(0) rotateZ(0)} 100%{transform:rotateY(1800deg) rotateZ(8deg)} }
    .face { position:absolute; inset:0; border-radius:50%; backface-visibility:hidden; display:grid; place-items:center; overflow:hidden; border:9px solid var(--edge); background:radial-gradient(circle at 30% 25%,#fff4a3 0,#facc15 24%,var(--coin) 55%,var(--coin2) 100%); box-shadow:inset 0 0 0 2px rgba(255,255,255,.5),inset -18px -18px 30px rgba(120,53,15,.3),0 22px 26px rgba(0,0,0,.4); }
    .face:after { content:""; position:absolute; inset:18px; border-radius:50%; border:2px dashed rgba(120,53,15,.45); }
    .face.back { transform:rotateY(180deg); }
    .face-content { position:relative; z-index:1; text-align:center; color:#713f12; text-shadow:0 1px rgba(255,255,255,.45); }
    .face-icon { font-size:56px; line-height:1; filter:drop-shadow(0 3px 1px rgba(120,53,15,.22)); }
    .face-label { font-size:25px; font-weight:900; margin-top:12px; max-width:190px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .shadow { position:absolute; bottom:90px; width:220px; height:28px; border-radius:50%; background:#000; filter:blur(17px); opacity:.48; }
    .result { position:absolute; bottom:30px; text-align:center; z-index:2; }
    .result small { color:var(--muted); display:block; margin-bottom:6px; }
    .result strong { font-size:26px; }
    .controls { padding:28px; }
    .section + .section { border-top:1px solid rgba(255,255,255,.1); margin-top:25px; padding-top:25px; }
    label, .label { display:block; font-size:13px; color:#bcc7e7; font-weight:700; margin-bottom:10px; }
    .range-row { display:flex; justify-content:space-between; align-items:center; gap:14px; }
    .percent { color:var(--accent2); font-weight:900; font-size:20px; }
    input[type=range] { width:100%; accent-color:var(--accent2); cursor:pointer; }
    .face-inputs { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    input[type=text] { width:100%; border:1px solid rgba(255,255,255,.14); border-radius:13px; padding:13px 14px; background:rgba(0,0,0,.16); color:var(--ink); outline:none; }
    input[type=text]:focus { border-color:var(--accent2); }
    .styles { display:grid; grid-template-columns:repeat(4,1fr); gap:9px; }
    .style { border:1px solid rgba(255,255,255,.14); border-radius:14px; background:rgba(255,255,255,.05); padding:10px 5px; color:#dfe6ff; cursor:pointer; font-size:12px; }
    .style i { display:block; width:30px; height:30px; border-radius:50%; margin:0 auto 7px; background:var(--swatch); box-shadow:inset -5px -5px 8px rgba(0,0,0,.25); }
    .style.active { border-color:var(--accent2); box-shadow:0 0 0 2px rgba(34,211,238,.15); }
    .action { width:100%; border:0; border-radius:15px; padding:16px; font-size:17px; font-weight:900; color:#07111d; background:linear-gradient(100deg,var(--accent2),#a7f3d0); cursor:pointer; box-shadow:0 12px 26px rgba(34,211,238,.22); transition:transform .2s,filter .2s; }
    .action:hover { transform:translateY(-2px); filter:brightness(1.08); }
    .hint { font-size:12px; color:var(--muted); line-height:1.55; margin-top:14px; }
    @media(max-width:780px){ header{display:block} .badge{display:inline-block;margin-top:20px} .layout{grid-template-columns:1fr} .stage{min-height:500px} }
  </style>
</head>
<body>
  <div class="orb"></div>
  <main>
    <header><div><div class="eyebrow">BORING COIN / 3D FLIP LAB</div><h1>缈讳釜纭竵锛?br><span style="color:var(--accent2)">璁╂鐜囪璇濄€?/span></h1><p class="sub">鑷畾涔変袱闈㈢殑姒傜巼銆佹枃瀛楀拰澶栬銆傜偣鍑荤‖甯佹垨鎸夌┖鏍奸敭锛岀湅鐪嬪懡杩愯繖娆¤惤鍦ㄥ摢涓€闈€?/p></div><div class="badge">鈼?鍗虫椂闅忔満 路 3D 鐗╃悊鎰熷姩鐢?/div></header>
    <section class="layout">
      <div class="card stage"><div class="shadow"></div><div class="coin-wrap"><div class="coin" id="coin" role="button" tabindex="0" aria-label="鐐瑰嚮缈荤‖甯?><div class="face front"><div class="face-content"><div class="face-icon" id="frontIcon">鈽€</div><div class="face-label" id="frontLabel">姝ｉ潰</div></div></div><div class="face back"><div class="face-content"><div class="face-icon" id="backIcon">鈽?/div><div class="face-label" id="backLabel">鍙嶉潰</div></div></div></div></div><div class="result"><small>鏈缁撴灉</small><strong id="result">鍑嗗濂戒簡鍚楋紵</strong></div></div>
      <aside class="card controls">
        <div class="section"><div class="range-row"><label for="probability">姝ｉ潰姒傜巼</label><span class="percent" id="percent">50%</span></div><input id="probability" type="range" min="0" max="100" value="50"/><div class="hint">鍙嶉潰姒傜巼浼氳嚜鍔ㄤ繚鎸佷负 <span id="otherPercent">50%</span>銆傛鐜囧彧褰卞搷缁撴灉锛屼笉褰卞搷鍔ㄧ敾銆?/div></div>
        <div class="section"><span class="label">涓ら潰鏂囧瓧</span><div class="face-inputs"><input id="frontText" type="text" value="姝ｉ潰" maxlength="10" aria-label="姝ｉ潰鏂囧瓧"/><input id="backText" type="text" value="鍙嶉潰" maxlength="10" aria-label="鍙嶉潰鏂囧瓧"/></div></div>
        <div class="section"><span class="label">纭竵鏍峰紡</span><div class="styles"><button class="style active" data-style="gold"><i style="--swatch:linear-gradient(135deg,#fff4a3,#eab308 55%,#92400e)"></i>榛勯噾</button><button class="style" data-style="rose"><i style="--swatch:linear-gradient(135deg,#ffe4e6,#fb7185 55%,#9f1239)"></i>鐜懓</button><button class="style" data-style="ice"><i style="--swatch:linear-gradient(135deg,#cffafe,#22d3ee 55%,#155e75)"></i>鍐拌摑</button><button class="style" data-style="violet"><i style="--swatch:linear-gradient(135deg,#ede9fe,#a78bfa 55%,#5b21b6)"></i>鏄熺传</button></div></div>
        <div class="section"><button class="action" id="flipBtn">缈昏浆纭竵 <span>鈫?/span></button><div class="hint">蹇嵎閿細绌烘牸閿炕杞?路 姣忔缈昏浆閮戒細閲嶆柊璁＄畻闅忔満缁撴灉</div></div>
      </aside>
    </section>
  </main>
  <script>
    const $ = s => document.querySelector(s);
    const coin = $('#coin'), probability = $('#probability');
    let currentFace = 'front', flipping = false;
    const themes = {
      gold: ['#f7c948','#d97706','#b45309','#8b5cf6','#22d3ee'], rose: ['#fb7185','#be123c','#9f1239','#f472b6','#67e8f9'],
      ice: ['#67e8f9','#0891b2','#155e75','#22d3ee','#a7f3d0'], violet: ['#c4b5fd','#7c3aed','#5b21b6','#a78bfa','#67e8f9']
    };
    function sync(){ $('#percent').textContent=probability.value+'%'; $('#otherPercent').textContent=(100-probability.value)+'%'; $('#frontLabel').textContent=$('#frontText').value||'姝ｉ潰'; $('#backLabel').textContent=$('#backText').value||'鍙嶉潰'; }
    function flip(){ if(flipping)return; flipping=true; const front= Math.random()*100 < Number(probability.value); const turns=front ? 5 : 6; coin.style.transform=`rotateY(${turns*360 + (front?0:180)}deg) rotateZ(8deg)`; coin.classList.add('flipping'); $('#result').textContent='鏃嬭浆涓€?; setTimeout(()=>{ currentFace=front?'front':'back'; $('#result').textContent=front?($('#frontText').value||'姝ｉ潰'):($('#backText').value||'鍙嶉潰'); coin.classList.remove('flipping'); flipping=false; },1100); }
    probability.addEventListener('input',sync); ['frontText','backText'].forEach(id=>$('#'+id).addEventListener('input',sync)); $('#flipBtn').addEventListener('click',flip); coin.addEventListener('click',flip); document.addEventListener('keydown',e=>{ if(e.code==='Space'){e.preventDefault();flip();} });
    document.querySelectorAll('.style').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.style').forEach(b=>b.classList.remove('active'));btn.classList.add('active'); const [a,b,c,d,e]=themes[btn.dataset.style]; document.documentElement.style.setProperty('--coin',a);document.documentElement.style.setProperty('--coin2',b);document.documentElement.style.setProperty('--edge',c);document.documentElement.style.setProperty('--accent',d);document.documentElement.style.setProperty('--accent2',e);}));
    sync();
  </script>
</body>
</html>
